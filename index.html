 <script> 
  const jawabanBenar = "ILOVEYOU";
  const kotak = document.querySelectorAll('.kotak');

  function cek() {
    let hasil = "";
    kotak.forEach(function (k) {
      hasil += k.value;
    });

    if (hasil.toUpperCase() === jawabanBenar.toUpperCase()) {
      localStorage.clear();                    
      window.location.href = "selamat.html";
    }
  }

  kotak.forEach(function (k, i) {
    k.value = localStorage.getItem('huruf' + i) || '';

    k.addEventListener('input', function () {
      localStorage.setItem('huruf' + i, k.value);
      cek();
    });
  });
</script>
